name: CI

# Pre-merge validation only. Every gate this repo has, run on every pull
# request — this is the gate you want green before merging into dev / main.
#
# Deploy workflows (deploy-dev.yml, deploy-uat.yml, deploy-prod.yml) run the
# SAME gates when a merge lands on their branch, then build and ship. That
# means one push = one pipeline, no redundant parallel builds on dev / main.
# CI on push-to-any-branch was removed to make that so.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run it superseded.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs from the lockfile exactly and fails if
      # package.json and package-lock.json have drifted.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Guards the class of bug that broke member creation: a field name the API
      # does not have. The script exits 0 if the spec is unreachable, so a
      # network blip cannot fail an unrelated build — it only fails on a real
      # mismatch.
      - name: Verify API contract
        run: npm run verify:contract

      # Fails only on CRITICAL. There are 9 high advisories today, all in the
      # build toolchain and none shipped to users; gating on `high` would mean a
      # permanently red pipeline that everybody learns to ignore. Review the
      # highs deliberately instead — see docs/AUDIT.md §10.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
