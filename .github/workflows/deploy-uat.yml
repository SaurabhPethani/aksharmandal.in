name: Deploy aksharmandal.in (UAT)

# Auto-deploys the uat branch to the UAT environment on the VPS.
#   branch          : uat
#   VITE_API_BASE   : /aksharconnect
#                     Relative path — same-origin request to uat.aksharmandal.in.
#                     Identical PATH structure to prod; only the hostname differs.
#                     Nginx distinguishes SPA vs API by location precedence
#                     (see infrastructure/docs/DEPLOYMENT_GUIDE.md).
#                     No landing-page deploy step (only the SPA).
#   SCP target      : /var/www/uat.aksharmandal.in/aksharconnect
#
# The app lives at the repo ROOT (it was moved out of aksharconnect/ in
# 75112a7), so every path below is root-relative. The /aksharconnect segment
# that remains is the URL/deploy prefix, not a source directory.
# Kept intentionally separate from deploy-dev.yml so DEV and UAT can diverge.

on:
  push:
    branches:
      - uat

concurrency:
  group: deploy-aksharmandal-uat
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match ci.yml so tests run on the same Node version the merge PR
          # was validated against.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # `ci`, not `install`: installs from the lockfile exactly and fails on
      # drift, so a deploy can never build a different tree than CI verified.
      - name: Install Dependencies
        run: npm ci

      # Same gates as ci.yml, run inline so this workflow is a
      # verify-then-deploy pipeline. If any fail, build + scp never run.
      - name: Verify API contract
        run: npm run verify:contract

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Build (UAT)
        run: npm run build
        env:
          # Same-origin, host-agnostic. Identical PATH structure to prod:
          #   SPA:  <host>/aksharconnect/...
          #   API:  <host>/aksharconnect/api/v1/...
          # Nginx on uat.aksharmandal.in proxies /aksharconnect/api/ to
          # 127.0.0.1:8012 (UAT backend); everything else under /aksharconnect/
          # falls through to the SPA. See DEPLOYMENT_GUIDE.md.
          VITE_API_BASE: /aksharconnect

      - name: Deploy Akshar Connect via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/uat.aksharmandal.in/aksharconnect"
          strip_components: 1
          overwrite: true
